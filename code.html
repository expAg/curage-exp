<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curage neuro-symbolique d’un réseau lexico-sémantique : implémentation</title>
<style>
:root{
  --bg:#ffffff;--ink:#1d1f22;--muted:#6a7078;--line:#e6e8eb;--soft:#f4f5f7;--accent:#2c5a85;
  --t-met:#7a4bb5;--t-eva:#b0602a;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181b;--ink:#e3e5e8;--muted:#9da3ab;--line:#2b3035;--soft:#1f2327;--accent:#8bb7e2;
  --t-met:#b79ae6;--t-eva:#e6a26f;}}
:root[data-theme="dark"]{--bg:#16181b;--ink:#e3e5e8;--muted:#9da3ab;--line:#2b3035;--soft:#1f2327;--accent:#8bb7e2;--t-met:#b79ae6;--t-eva:#e6a26f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 32px 0;border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0 0 10px;font-weight:600}
h1 a{font-weight:400;font-size:13px;color:var(--muted);margin-left:12px}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{border:0;background:none;font:inherit;font-size:13.5px;cursor:pointer;color:var(--muted);padding:7px 12px;border-bottom:2px solid transparent}
nav button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--fam)}
nav .pref{font-weight:600;margin-right:4px}
main{padding:20px 32px 60px;max-width:1100px}
h3{font-size:11.5px;margin:18px 0 5px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
h3:first-child{margin-top:0}
pre{font-family:var(--mono);font-size:12.5px;white-space:pre;background:var(--soft);border-radius:4px;padding:10px 12px;margin:0;overflow:auto}
pre.code{max-height:70vh}
pre.attendu{white-space:pre-wrap}
h3.chemin{text-transform:none;letter-spacing:0;font-family:var(--mono);font-size:12px}
@media (max-width:700px){header,main{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<header>
  <h1>Curage neuro-symbolique d’un réseau lexico-sémantique : implémentation<a href="index.html">données</a></h1>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<script>
"use strict";
const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let courant = 0;
function afficher(){
  const S = window.DONNEES.sources, f = S[courant];
  document.getElementById('nav').innerHTML = S.map((x, i) => {
    const [dossier, nom] = x.fichier.split('/'), meth = dossier === 'methode';
    return `<button data-i="${i}" class="${i === courant ? 'on' : ''}" style="--fam:var(${meth ? '--t-met' : '--t-eva'})"><span class="pref" style="color:var(${meth ? '--t-met' : '--t-eva'})">${meth ? 'Méthode' : 'Expérimentation'} :</span>${esc(nom)}</button>`;
  }).join('');
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => { courant = +b.dataset.i; afficher(); });
  document.getElementById('main').innerHTML = `<h3>Lancement</h3><pre>${esc(f.commande)}</pre>`
    + `<h3>Résultat attendu</h3><pre class="attendu">${esc(f.attendu)}</pre>`
    + `<h3 class="chemin">code/${esc(f.fichier)}</h3><pre class="code">${esc(f.code)}</pre>`;
}
window.addEventListener('DOMContentLoaded', afficher);
</script>
<script>document.write('<script src="page/sources.js?v=' + Date.now() + '"><\/script>');</script>
</body>
</html>
